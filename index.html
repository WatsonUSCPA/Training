<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>筋トレ記録</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>💪 筋トレ記録</h1>
  </header>

  <main>
    <!-- ============ タイマー ============ -->
    <section id="tab-timer" class="tab-panel">
      <div class="card">
        <h2>タイマー</h2>

        <div class="timer-display" id="timerDisplay">00:00.0</div>

        <div class="timer-mode">
          <button class="mode-btn active" data-mode="stopwatch">ストップウォッチ</button>
          <button class="mode-btn" data-mode="interval">インターバル</button>
        </div>

        <!-- インターバル用プリセット -->
        <div class="interval-presets" id="intervalPresets" hidden>
          <button class="preset-btn" data-sec="30">30秒</button>
          <button class="preset-btn" data-sec="60">60秒</button>
          <button class="preset-btn" data-sec="90">90秒</button>
          <button class="preset-btn" data-sec="120">2分</button>
          <button class="preset-btn" data-sec="180">3分</button>
          <div class="custom-interval">
            <input type="number" id="customInterval" min="1" placeholder="秒" />
            <button id="setCustomInterval">設定</button>
          </div>
        </div>

        <div class="timer-controls">
          <button id="timerStart" class="btn btn-primary">スタート</button>
          <button id="timerStop" class="btn" disabled>ストップ</button>
          <button id="timerReset" class="btn btn-ghost">リセット</button>
        </div>
      </div>
    </section>

    <!-- ============ 記録 ============ -->
    <section id="tab-record" class="tab-panel active">
      <div class="card">
        <h2>トレーニングを記録</h2>

        <label class="field">
          <span>日付</span>
          <input type="date" id="recordDate" />
        </label>

        <!-- 部位選択 -->
        <label class="field">
          <span>部位</span>
          <div class="row">
            <select id="bodyPartSelect"></select>
            <button id="addBodyPart" class="btn btn-ghost btn-sm" title="部位を追加">＋</button>
          </div>
        </label>

        <!-- 種目選択 -->
        <label class="field">
          <span>種目</span>
          <div class="row">
            <select id="exerciseSelect"></select>
            <button id="addExercise" class="btn btn-ghost btn-sm" title="種目を新規追加">＋</button>
          </div>
        </label>

        <!-- 前回の記録 -->
        <div id="lastRecord" class="last-record" hidden></div>

        <!-- セット入力 -->
        <div class="sets-area" id="setsArea">
          <div class="sets-toolbar">
            <span>セット内容</span>
            <div class="unit-toggle">
              <button type="button" class="unit-btn active" data-unit="lb">lb</button>
              <button type="button" class="unit-btn" data-unit="kg">kg</button>
            </div>
          </div>
          <div class="sets-header" id="setsHeader">
            <span>#</span>
            <span>重量(<span id="unitLabel">lb</span>)</span>
            <span>回数</span>
            <span>🔻</span>
            <span></span>
          </div>
          <div id="setsList"></div>
          <button id="addSet" class="btn btn-ghost btn-sm">＋ セットを追加</button>
        </div>

        <label class="field">
          <span>メモ（任意）</span>
          <input type="text" id="recordMemo" placeholder="調子・フォームなど" />
        </label>

        <button id="saveRecord" class="btn btn-primary btn-block">記録を保存</button>
      </div>
    </section>

    <!-- ============ ランニング ============ -->
    <section id="tab-running" class="tab-panel">
      <div class="card">
        <h2>🏃 今週のランニング</h2>
        <div class="run-week-range" id="runWeekRange"></div>

        <div class="run-progress">
          <div class="run-progress-top">
            <span class="run-current" id="runCurrentKm">0.0</span>
            <span class="run-goal">mile / 目標 <b id="runGoalKm">8</b> mile</span>
          </div>
          <div class="run-bar"><div class="run-bar-fill" id="runBarFill"></div></div>
          <div class="run-progress-sub" id="runProgressSub"></div>
        </div>

        <label class="field">
          <span>1週間の目標距離（mile）</span>
          <div class="row">
            <input type="number" id="runGoalInput" min="0" step="0.5" inputmode="decimal" />
            <button id="saveRunGoal" class="btn btn-ghost btn-sm">保存</button>
          </div>
        </label>
      </div>

      <div class="card">
        <h2>ランを記録</h2>

        <label class="field">
          <span>日付</span>
          <input type="date" id="runDate" />
        </label>

        <div class="run-inputs">
          <label class="field">
            <span>距離（mile）</span>
            <input type="number" id="runKm" min="0" step="0.1" inputmode="decimal" placeholder="例：3" />
          </label>
          <label class="field">
            <span>時間（分・任意）</span>
            <input type="number" id="runMinutes" min="0" step="1" inputmode="numeric" placeholder="例：30" />
          </label>
        </div>

        <div class="run-pace" id="runPaceHint" hidden></div>

        <label class="field">
          <span>メモ（任意）</span>
          <input type="text" id="runMemo" placeholder="コース・体調など" />
        </label>

        <button id="saveRun" class="btn btn-primary btn-block">ランを記録</button>
      </div>

      <div class="card">
        <h2>今週のラン</h2>
        <div id="runWeekList" class="run-week-list"></div>
      </div>
    </section>

    <!-- ============ 履歴 ============ -->
    <section id="tab-history" class="tab-panel">
      <div class="card">
        <div class="history-toolbar">
          <h2>履歴</h2>
          <div class="row">
            <button id="exportCsv" class="btn btn-ghost btn-sm">CSV出力</button>
          </div>
        </div>

        <!-- カレンダー -->
        <div class="calendar">
          <div class="cal-header">
            <button id="calPrev" class="cal-nav" type="button">‹</button>
            <span id="calMonth" class="cal-month"></span>
            <button id="calNext" class="cal-nav" type="button">›</button>
          </div>
          <div class="cal-weekdays">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="calGrid" class="cal-grid"></div>
        </div>

        <label class="field">
          <span>部位で絞り込み</span>
          <select id="historyFilter"></select>
        </label>

        <div id="historyList" class="history-list"></div>
      </div>
    </section>
  </main>

  <!-- ============ ナビゲーション ============ -->
  <nav class="tab-bar">
    <button class="tab-btn" data-tab="timer">⏱<span>タイマー</span></button>
    <button class="tab-btn active" data-tab="record">📝<span>記録</span></button>
    <button class="tab-btn" data-tab="running">🏃<span>ラン</span></button>
    <button class="tab-btn" data-tab="history">📊<span>履歴</span></button>
  </nav>

  <!-- ============ モーダル（汎用入力） ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <input type="text" id="modalInput" />
      <div id="modalType" class="modal-type" hidden>
        <span class="modal-type-label">記録のしかた</span>
        <div class="mtype-toggle">
          <button type="button" class="mtype-btn active" data-mtype="weight">重量 × 回数</button>
          <button type="button" class="mtype-btn" data-mtype="time">時間（秒）</button>
          <button type="button" class="mtype-btn" data-mtype="distance">距離（mile）</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-ghost">キャンセル</button>
        <button id="modalOk" class="btn btn-primary">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
